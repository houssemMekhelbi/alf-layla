<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Alf Layla type:
       display    Libre Caslon Display  lock clock
       book       Libre Caslon Text     + Scheherazade New (Arabic): banner names, dates, notification titles
       interface  Albert Sans           + IBM Plex Sans Arabic
       data       Spline Sans Mono      + IBM Plex Sans Arabic, JetBrains Mono Nerd Font
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. Spline Sans Mono has no powerline/Nerd glyphs;
     JetBrains Mono Nerd Font supplies them. The star marks come from
     Noto Sans Symbols 2 / DejaVu Sans Mono further down. -->
<fontconfig>
  <alias binding="same">
    <family>Albert Sans</family>
    <accept><family>IBM Plex Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Libre Caslon Text</family>
    <accept><family>Scheherazade New</family></accept>
  </alias>
  <alias binding="same">
    <family>Libre Caslon Display</family>
    <accept><family>Scheherazade New</family></accept>
  </alias>
  <alias binding="same">
    <family>Spline Sans Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Albert Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Libre Caslon Text</family>
      <family>Scheherazade New</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Spline Sans Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
