# Alf Layla tmux. Status at the bottom on the terminal's own night with a
# hairline above it (the pane border). Session name in a solid copper block,
# windows as plain index:name with the current one underlined in lamp amber,
# activity marked in faience, the clock muted on the right. No powerline
# slants: the theme's forms are frames, and a cell cannot nest one.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=default,fg=#9E94BA"

set -g status-left-length 40
set -g status-left "#[bg=#C57B57,fg=#110E24,bold] #{=/24/…:session_name} #[default]  "

set -g status-right-length 40
set -g status-right "#[fg=#9E94BA]%d %b  %H:%M "

set -g window-status-separator "  "
set -g window-status-format "#[fg=#9E94BA]#I:#W#{?window_activity_flag,#[fg=#6FC2B6] •,}"
set -g window-status-current-format "#[fg=#EFE4D0,bold,underscore,us=#F3B95F]#I:#W#[nounderscore]"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active copper, inactive line.
set -g pane-border-lines single
set -g pane-border-style "fg=#3a2f5c"
set -g pane-active-border-style "fg=#c57b57"
set -g pane-border-indicators off

set -g message-style "bg=#231C42,fg=#EFE4D0"
set -g message-command-style "bg=#231C42,fg=#F3B95F"
set -g mode-style "bg=#231C42,fg=#EFE4D0"
set -g copy-mode-match-style "bg=#231C42,fg=#6FC2B6,underscore"
set -g copy-mode-current-match-style "bg=#231C42,fg=#F3B95F,underscore"
set -g menu-style "bg=#1A1533,fg=#EFE4D0"
set -g menu-selected-style "bg=#231C42,fg=#F3B95F"
set -g menu-border-style "fg=#C57B57"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#C57B57"
set -g popup-border-lines rounded
set -g display-panes-colour "#3A2F5C"
set -g display-panes-active-colour "#F3B95F"
set -g clock-mode-colour "#EFE4D0"
