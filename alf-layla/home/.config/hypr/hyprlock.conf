# Alf Layla lock screen. The lattice window stays in view on the right; the
# left column carries the clock, the night's number (day of the year) with the
# date, the password in a field two frames deep, and the saying: the line that
# closes every night of the book, in Arabic with its translation under it.
# No username. Sayings: ~/.config/hypr/alf-layla/sayings.txt (layla-lock-saying).
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/alf-layla/wallpaper.png
    color = rgb(110E24)
    blur_passes = 1
    blur_size = 2
    brightness = 0.80
    vibrancy = 0
    noise = 0.01
}

# ---- clock, night, date ---------------------------------------------------

label {
    monitor =
    text = $TIME
    color = rgba(EFE4D0FF)
    font_size = 190
    font_family = Libre Caslon Display
    position = 170, 250
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<i><span foreground='##F3B95F'>Night $(date +%-j)</span>    <span foreground='##9E94BA' size='78%'>$(date +'%A, %-d %B')</span></i>"
    color = rgba(EFE4D0FF)
    font_size = 26
    font_family = Libre Caslon Text
    position = 182, 112
    halign = left
    valign = center
}

# ---- the field: two frames deep ---------------------------------------------

shape {
    monitor =
    size = 460, 54
    color = rgba(110E24CC)
    rounding = 3
    border_size = 1
    border_color = rgba(C57B57FF)
    position = 178, 30
    halign = left
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 452, 46
    outline_thickness = 1
    outer_color = rgba(C57B578C)
    inner_color = rgba(00000000)
    font_color = rgba(EFE4D0FF)
    font_family = Spline Sans Mono
    check_color = rgba(F3B95FFF)
    fail_color = rgba(E08497FF)
    capslock_color = rgba(6FC2B6FF)
    rounding = 1
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##F3B95F">›</span>   <span foreground="##9E94BA">password</span>
    fail_text = <span foreground="##E08497">$FAIL</span>
    check_text = <span foreground="##F3B95F">verifying</span>
    zindex = 1
    position = 182, 30
    halign = left
    valign = center
}

# ---- the saying --------------------------------------------------------------
# Anchored left like the rest of the column, so a wider monitor cannot push it
# onto the window; the Arabic lines are right-aligned inside their own block.

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/layla-lock-saying ar
    color = rgba(EFE4D0FF)
    font_size = 48
    font_family = Scheherazade New
    text_align = right
    position = 182, -190
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/layla-lock-saying en
    color = rgba(9E94BAFF)
    font_size = 18
    font_family = Libre Caslon Text
    position = 184, -335
    halign = left
    valign = center
}

# ---- footer --------------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>ALF LAYLA</span>
    color = rgba(6A618EFF)
    font_size = 9
    font_family = Spline Sans Mono
    position = 182, 40
    halign = left
    valign = bottom
}
