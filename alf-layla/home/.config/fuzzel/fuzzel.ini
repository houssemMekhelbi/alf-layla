# Alf Layla launcher for fuzzel (unused: SUPER+D runs layla-launcher, foot + fzf).

[main]
font=Albert Sans:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=1A1533F7
text=9E94BAFF
message=9E94BAFF
prompt=F3B95FFF
placeholder=6A618EFF
input=EFE4D0FF
match=C57B57FF
selection=231C42FF
selection-text=EFE4D0FF
selection-match=F3B95FFF
counter=6FC2B6FF
border=C57B57FF

[border]
width=1
radius=3
