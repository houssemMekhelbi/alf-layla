# Alf Layla terminal. Night at 90% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Spline Sans Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=beam
blink=no
beam-thickness=2

[colors-dark]
alpha=0.90
blur=yes
background=110E24
foreground=E6DBC8
cursor=110E24 F3B95F
regular0=110E24
regular1=E08497
